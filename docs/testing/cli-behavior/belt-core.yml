scope: "belt-core pure library public API. F1: config (6). F2a: engine (19) / view (15) / lint (15) / model (22) / gate (9) / error (3) / expander (4) / parser (4) / uri (5) / artifact_when (5) の 10 module + config absolute-path 復帰 1 = 103 scenarios 追加 (F2a 累計) + uri::Current 5 + gate URI-resolve 2 = 110。残 shape-lock 4 file (bug_fix_refresh / review_skills_refresh / shared_criteria_parity / shared_filter_parity) の lock-ledger.md entry 追加は F2b scope"
scenarios:
  - id: belt-core-config-valid-toml-parses
    category: config
    severity: high
    technique: equivalence-partition
    given: "a valid belt.toml with pipeline_file field"
    when: "parse_config() is called"
    then: "returns Config with parsed pipeline_file path"
  - id: belt-core-config-missing-file-yields-file-not-found
    category: config
    severity: high
    technique: equivalence-partition
    given: "a path to a nonexistent belt.toml"
    when: "parse_config() is called"
    then: "returns BeltError::FileNotFound variant"
  - id: belt-core-config-invalid-toml-yields-config-parse
    category: config
    severity: high
    technique: equivalence-partition
    given: "a belt.toml with invalid TOML syntax"
    when: "parse_config() is called"
    then: "returns BeltError::ConfigParse variant"
  - id: belt-core-config-missing-pipeline-file-field-yields-config-parse
    category: config
    severity: medium
    technique: equivalence-partition
    given: "a belt.toml without pipeline_file field"
    when: "parse_config() is called"
    then: "returns BeltError::ConfigParse variant"
  - id: belt-core-config-resolves-relative-pipeline-path
    category: config
    severity: high
    technique: equivalence-partition
    given: "a belt.toml with relative pipeline_file value"
    when: "resolve_pipeline_path(config, config_dir) is called"
    then: "returns absolute path joining config_dir and pipeline_file"
  - id: belt-core-config-resolves-subdirectory-pipeline-path
    category: config
    severity: medium
    technique: equivalence-partition
    given: "a belt.toml with relative pipeline_file containing a subdirectory (e.g. pipelines/main.yml)"
    when: "resolve_pipeline_path(config_path, config) is called"
    then: "returns config_dir joined with the subdirectory-qualified relative path"
  - id: belt-core-config-preserves-absolute-pipeline-path
    category: config
    severity: medium
    technique: boundary-value
    given: "a belt.toml with an absolute pipeline_file path (starts with /)"
    when: "resolve_pipeline_path(config_path, config) is called"
    then: "returns the absolute path unchanged, not joined with config_path's parent directory"

  # --- engine module ---
  - id: belt-core-engine-init-creates-run-with-first-active-phase
    category: engine
    severity: high
    technique: equivalence-partition
    given: "a pipeline YAML with one or more active phases"
    when: "Engine::init is called with empty args"
    then: "returns RunState with current_phase = first phase id, persists state.json, creates output_dir and notes/ directory under runs/<run_id>/"
  - id: belt-core-engine-init-canonicalizes-pipeline-file-path
    category: engine
    severity: high
    technique: equivalence-partition
    given: "a pipeline path containing relative segments, symlinks, or already absolute form"
    when: "Engine::init is called"
    then: "state.pipeline_file is an absolute canonical path with no '..' or '/./' segments and symlinks resolved to the real target"
  - id: belt-core-engine-init-records-optional-branch-verbatim
    category: engine
    severity: medium
    technique: equivalence-partition
    given: "a caller invoking Engine::init_with_branch with Some(name) or the legacy Engine::init"
    when: "the engine initialises a run"
    then: "state.branch equals the supplied Option value verbatim (Some when provided, None for legacy init)"
  - id: belt-core-engine-init-auto-sets-verify-for-gateless-first-phase
    category: engine
    severity: high
    technique: decision-table
    given: "a pipeline whose first active phase has no gate vs a pipeline whose first phase has gate checks"
    when: "Engine::init is called"
    then: "phase_verify_passed[first] = Some(true) for the gateless case and is absent for the gated case"
  - id: belt-core-engine-init-error-paths
    category: engine
    severity: high
    technique: error-guessing
    given: "a pipeline where every phase's when: evaluates to false, or a path to a file that does not exist"
    when: "Engine::init is called"
    then: "no-active-phase case returns BeltError::InvalidPipeline; nonexistent path surfaces a parse-layer error (FileNotFound or YamlParse) and never BeltError::Io from canonicalize"
  - id: belt-core-engine-step-advances-through-active-phases-and-completes
    category: engine
    severity: high
    technique: state-transition
    given: "a multi-phase pipeline with verify already recorded for each current phase"
    when: "Engine::step is called repeatedly"
    then: "current_phase advances through active phases, completed_phases accumulates in order, and after the last phase current_phase = COMPLETED, status = RunStatus::Completed (persisted to state.json), next returns None"
  - id: belt-core-engine-step-skips-phases-whose-when-is-false
    category: engine
    severity: high
    technique: decision-table
    given: "a pipeline containing a phase with when: args.X where X is false or absent"
    when: "Engine::step advances past the prior phase"
    then: "the conditional phase id is appended to skipped_phases, current_phase jumps to the next active phase, and phase_verify_passed contains no entry for the skipped phase"
  - id: belt-core-engine-step-requires-verify-before-advancing-gate-phase
    category: engine
    severity: high
    technique: decision-table
    given: "the current phase has at least one gate check and phase_verify_passed is absent or false"
    when: "Engine::step is called"
    then: "returns BeltError::VerifyRequired with phase_id equal to the current phase, and repeated calls remain rejected without mutating state"
  - id: belt-core-engine-step-auto-verifies-gateless-next-phase-on-entry
    category: engine
    severity: medium
    technique: state-transition
    given: "Engine::step advances from a gated phase to a phase with no gate checks"
    when: "the transition occurs"
    then: "phase_verify_passed[next] is automatically set to true and a subsequent step succeeds without an explicit verify_verdict call; verify state does not carry from one gated phase to the next"
  - id: belt-core-engine-verify-verdict-increments-attempts-and-records-outcome
    category: engine
    severity: high
    technique: state-transition
    given: "a run positioned on a gated phase"
    when: "Engine::verify_verdict is called one or more times with true or false"
    then: "phase_attempts[phase] increases by one per call regardless of verdict and phase_verify_passed[phase] reflects the latest boolean verdict"
  - id: belt-core-engine-step-blocks-when-max-retries-exceeded
    category: engine
    severity: high
    technique: boundary-value
    given: "a phase declares max_retries = N > 0 and phase_attempts exceeds N after several verify_verdict calls"
    when: "Engine::step is called"
    then: "returns BeltError::MaxRetriesExceeded carrying phase_id, attempts, and max_retries; step stays blocked while verify_verdict continues to increment attempts"
  - id: belt-core-engine-max-retries-zero-is-unlimited
    category: engine
    severity: medium
    technique: boundary-value
    given: "a gated phase with max_retries = 0 (the default) and many FAIL attempts followed by a PASS"
    when: "Engine::step is called after the final PASS"
    then: "step succeeds regardless of the attempt count (0 is interpreted as unlimited)"
  - id: belt-core-engine-guard-order-verify-then-regate-then-max-retries
    category: engine
    severity: high
    technique: decision-table
    given: "a step() call where multiple guards would apply simultaneously"
    when: "Engine::step evaluates guards"
    then: "VerifyRequired is returned before RegateRequired, and RegateRequired is returned before MaxRetriesExceeded"
  - id: belt-core-engine-regate-requires-record-before-step-and-resets-on-reverify
    category: engine
    severity: high
    technique: state-transition
    given: "a gated phase with regate: [<targets>] whose verify has passed"
    when: "Engine::step is called without record_regate, with record_regate(false), with record_regate(true), or after a re-verify following a recorded regate"
    then: "no record yields RegateRequired, false yields RegateFailed, true yields a successful advance, and any subsequent verify_verdict clears regate_passed so step is blocked again until regate is re-recorded; init leaves regate_passed empty and record_regate is idempotent"
  - id: belt-core-engine-regate-handles-empty-or-skipped-or-gateless-targets
    category: engine
    severity: medium
    technique: equivalence-partition
    given: "a regate target list containing phases with empty gate, skipped (when:false) phases, or a current phase that is itself gateless"
    when: "Engine::record_regate and Engine::step are exercised"
    then: "empty-gate targets and skipped targets are treated as passed; a gateless current phase still requires regate to be recorded before step succeeds"
  - id: belt-core-engine-state-round-trips-through-save-load
    category: engine
    severity: high
    technique: equivalence-partition
    given: "a RunState mutated via init, verify_verdict, record_regate, or direct field writes and saved to disk"
    when: "Engine::load_state is called with the same run_id"
    then: "all observable fields (run_id, pipeline, pipeline_file, version, current_phase, completed_phases, skipped_phases, phase_verify_passed, regate_passed, status, phase_start_times, created_at, updated_at) are equal to the in-memory state, and the reloaded pipeline_file is usable by next_phase_info"
  - id: belt-core-engine-latest-run-id-returns-most-recent-or-errors-when-empty
    category: engine
    severity: high
    technique: boundary-value
    given: "zero, one, or multiple runs persisted under <belt_dir>/runs/"
    when: "Engine::latest_run_id is called"
    then: "returns the UUIDv7-ordered most recent run_id when runs exist, and returns BeltError::State when no runs exist; load_state for an unknown id also returns BeltError::State"
  - id: belt-core-engine-phase-start-times-set-on-entry-preserved-on-retry-and-persisted
    category: engine
    severity: medium
    technique: state-transition
    given: "init plus subsequent step() and verify_verdict() calls on a run with multiple phases"
    when: "phase_start_times is inspected in-memory and after load_state"
    then: "each phase has a UTC timestamp set when step() first enters it, retries (verify PASS or FAIL) do not update an existing entry, and the map round-trips through state.json with identical RFC3339 values"
  - id: belt-core-engine-next-phase-info-expands-run-id-and-exposes-output-dir
    category: engine
    severity: high
    technique: equivalence-partition
    given: "a phase whose gate contains file_exists: '…{run_id}…' and whose produces[*].path contains '{run_id}'"
    when: "Engine::next_phase_info is called"
    then: "the returned PhaseInfo has output_dir set to an existing directory under runs/<run_id>/, and every {run_id} token in gate paths and produces[*].path is replaced with the current run_id (no template token remains)"

  # --- view module ---
  - id: belt-core-view-phase-state-classified-by-membership
    category: view
    severity: high
    technique: decision-table
    given: "a RunState whose current_phase, completed_phases, and skipped_phases name a subset of the pipeline's phases"
    when: "build_status_view is called"
    then: "every phase is classified as Completed (in completed_phases), Skipped (in skipped_phases), Current (equals current_phase), or Pending (otherwise), preserving the pipeline's declared phase order"
  - id: belt-core-view-completed-sentinel-clears-current-phase
    category: view
    severity: high
    technique: state-transition
    given: "a RunState whose current_phase equals the COMPLETED sentinel, with completed_phases (and optionally skipped_phases) covering every active phase"
    when: "build_status_view is called"
    then: "PipelineStatus is Completed, current_phase is None, and each phase shows Completed or Skipped (never Current) in declaration order"
  - id: belt-core-view-progress-counts-sum-to-total
    category: view
    severity: high
    technique: boundary-value
    given: "a pipeline of N phases (N=1 for the single-phase boundary; N>=3 otherwise) with any mix of completed, skipped, and unvisited phases"
    when: "build_status_view is called"
    then: "progress.total == N, progress.completed + progress.skipped + progress.remaining == progress.total, and the individual tallies match the RunState membership counts (including the all-complete and all-pending extremes)"
  - id: belt-core-view-metadata-fields-propagated-verbatim
    category: view
    severity: medium
    technique: equivalence-partition
    given: "a RunState carrying run_id, pipeline, pipeline_file, version, args map, created_at, and updated_at"
    when: "build_status_view is called"
    then: "PipelineStatus copies every metadata field (including args entries) into the view verbatim without transformation"
  - id: belt-core-view-verify-passed-tri-state-reflects-record
    category: view
    severity: high
    technique: decision-table
    given: "phase_verify_passed for the current phase is absent, true, or false"
    when: "build_status_view is called"
    then: "PhaseView.verify_passed is None, Some(true), or Some(false) respectively"
  - id: belt-core-view-regate-passed-tri-state-reflects-record
    category: view
    severity: medium
    technique: decision-table
    given: "regate_passed for the current phase is absent or true"
    when: "build_status_view is called"
    then: "PhaseView.regate_passed is None when no record exists and Some(true) when recorded as passed"
  - id: belt-core-view-attempt-count-defaults-to-zero-and-reflects-record
    category: view
    severity: medium
    technique: boundary-value
    given: "phase_attempts lacks an entry for the phase (zero boundary) or records a positive count"
    when: "build_status_view is called"
    then: "PhaseView.attempt is 0 when absent and equals the recorded count otherwise"
  - id: belt-core-view-outputs-lists-phase-directory-files-sorted-excluding-subdirs
    category: view
    severity: high
    technique: equivalence-partition
    given: "the run's output directory for a phase is absent, empty, or contains a mix of files and subdirectories"
    when: "build_status_view is called"
    then: "PhaseView.outputs is empty when the directory is missing or empty, and otherwise lists only regular file names (subdirectories excluded) sorted ascending"
  - id: belt-core-view-sub-pipeline-phase-id-sanitized-to-underscore-for-filesystem
    category: view
    severity: high
    technique: equivalence-partition
    given: "a phase whose id contains a '/' separator (e.g. 'review/triage') and corresponding per-phase files on disk (output directory, verify JSON)"
    when: "build_status_view scans the filesystem for that phase"
    then: "the filesystem lookup substitutes '/' with '_' (reading 'review_triage/' for outputs and 'verify/review_triage.json' for verify_checks) while the view's phase id retains the original slash form"
  - id: belt-core-view-yaml-drift-preserves-orphan-completed-and-skipped-phases
    category: view
    severity: high
    technique: equivalence-partition
    given: "a pipeline definition that has added a new phase or removed phases that appear in the RunState's completed_phases or skipped_phases"
    when: "build_status_view is called"
    then: "newly added phases appear Pending in declaration order and removed-but-recorded phases are appended to the view with their recorded Completed or Skipped state preserved"
  - id: belt-core-view-engine-enriched-status-integrates-state-metadata-and-outputs
    category: view
    severity: high
    technique: state-transition
    given: "an Engine with a run created via init (optionally advanced via verify_verdict and step, with files written under runs/<run_id>/<phase>/)"
    when: "Engine::enriched_status is called with the run_id"
    then: "the returned view reflects the current/completed/skipped phase states, progress counts, and per-phase outputs read from the run directory; when state.pipeline_file points at a missing pipeline the call returns an error"
  - id: belt-core-view-verify-checks-read-from-verify-json-with-graceful-degradation
    category: view
    severity: high
    technique: equivalence-partition
    given: "the run directory's verify/<sanitized_phase>.json is absent, corrupt, or a well-formed VerifyReport"
    when: "build_status_view is called"
    then: "PhaseView.verify_checks is None when the file is absent or unparseable (graceful degradation) and Some(Vec<CheckView>) mirroring check_type/passed when parsing succeeds"
  - id: belt-core-view-regate-checks-read-from-regate-json-with-graceful-degradation
    category: view
    severity: medium
    technique: equivalence-partition
    given: "the run directory's regate/<phase>.json is absent, corrupt, or a well-formed regate report"
    when: "build_status_view is called"
    then: "PhaseView.regate_checks is None when the file is absent or unparseable and Some(targets map) preserving the passed/checks structure when parsing succeeds"
  - id: belt-core-view-phase-view-serializes-invoke-and-produces-as-structured-json
    category: view
    severity: medium
    technique: equivalence-partition
    given: "a PhaseMetadata carrying an Invoker::Skill and a produces Artifact list"
    when: "build_status_view is called and the resulting PipelineStatus is serialized with serde_json"
    then: "the view exposes invoke as Some and produces as a resolved list, and the JSON encoding contains the invoke object (with skill field), the produces array, and the artifact name"
  - id: belt-core-view-glob-produces-path-resolves-to-newest-file-after-phase-start-with-alphabetical-tiebreak
    category: view
    severity: high
    technique: decision-table
    given: "a produces Artifact whose path is a glob vs a concrete path, evaluated against candidate files older than, newer than, or equal-mtime with the phase_start_times entry"
    when: "build_status_view resolves the artifact"
    then: "glob paths pick the newest match strictly after phase_start (filtering older files out, reporting exists=false when no match remains, and breaking mtime ties by ascending filename), while concrete paths bypass the phase_start filter and resolve purely by filesystem existence"

  # --- lint module ---
  - id: belt-core-lint-detects-duplicate-phase-ids
    category: lint
    severity: high
    technique: equivalence-partition
    given: "a pipeline YAML with two phases sharing the same id"
    when: "lint_pipeline() is called"
    then: "an Error-severity diagnostic mentioning 'duplicate' is emitted"
  - id: belt-core-lint-detects-invalid-regate-target
    category: lint
    severity: high
    technique: equivalence-partition
    given: "a phase whose regate: list references a nonexistent phase id"
    when: "lint_pipeline() is called"
    then: "an Error-severity diagnostic naming the unknown target is emitted"
  - id: belt-core-lint-detects-undefined-arg-in-when
    category: lint
    severity: high
    technique: equivalence-partition
    given: "a phase with when: 'args.X' where X is not declared in pipeline args"
    when: "lint_pipeline() is called"
    then: "an Error-severity diagnostic naming the undefined arg is emitted"
  - id: belt-core-lint-clean-pipeline-passes
    category: lint
    severity: high
    technique: equivalence-partition
    given: "a well-formed pipeline with declared args, gate, when, and regate all resolving correctly"
    when: "lint_pipeline() is called"
    then: "no Error-severity diagnostics are returned"
  - id: belt-core-lint-invoke-pipeline-path-resolution
    category: lint
    severity: high
    technique: decision-table
    given: "a phase with invoke.pipeline pointing to either a nonexistent file or to an existing sibling sub-pipeline file"
    when: "lint_pipeline() is called"
    then: "missing file yields an Error-severity diagnostic naming the path and invoke/pipeline; existing file yields no errors"
  - id: belt-core-lint-invoke-skill-validation
    category: lint
    severity: high
    technique: decision-table
    given: "a phase with invoke.skill that is missing a leading slash, empty, absent with no description, or properly formed with leading slash plus description"
    when: "lint_pipeline() is called"
    then: "missing-slash yields an Error mentioning 'slash', empty-string yields an Error mentioning 'empty', missing-description yields an Error mentioning 'leaf phase' or 'description', and a well-formed /skill invocation yields no errors"
  - id: belt-core-lint-detects-duplicate-produces-name-within-phase
    category: lint
    severity: high
    technique: equivalence-partition
    given: "a phase whose produces: list has two entries sharing the same name"
    when: "lint_pipeline() is called"
    then: "an Error-severity diagnostic containing 'duplicate' and the shared name is emitted"
  - id: belt-core-lint-consumes-resolution
    category: lint
    severity: high
    technique: decision-table
    given: "a consumes: entry referencing a bare name with no matching produces, a {name, from} pair whose from-phase is unknown, a later phase's output (forward reference), or a correctly earlier-produced artifact (bare and qualified forms)"
    when: "lint_pipeline() is called"
    then: "unresolved bare and qualified references and forward references each yield an Error naming the offending token; valid backward references yield no errors"
  - id: belt-core-lint-validate-file-existence
    category: lint
    severity: high
    technique: decision-table
    given: "a phase whose validate: entry is file: <path> where the path is either missing or present, or a list of inline string criteria"
    when: "lint_pipeline() is called"
    then: "missing file yields an Error naming the path and 'validate'; present file yields no errors; inline-string validate produces no errors"
  - id: belt-core-lint-empty-phase-rule
    category: lint
    severity: high
    technique: decision-table
    given: "a phase declaring only description (no invoke, gate, validate, or confirm) vs a phase declaring exactly one of gate, validate, or confirm: true"
    when: "lint_pipeline() is called"
    then: "description-only yields an Error naming the phase id and 'neither invoke, gate, validate, nor confirm' (DD-8); any of gate-only, validate-only, or confirm-only passes the empty-phase rule"
  - id: belt-core-lint-rejects-invalid-belt-uri-grammar
    category: lint
    severity: high
    technique: error-guessing
    given: "a consumes: entry whose uri: uses an unknown belt:// selector"
    when: "lint_pipeline() is called"
    then: "either an Ok(diagnostics) containing a URI/selector/invalid diagnostic, or an Err whose Display mentions URI or belt://; parse-layer rejection is also acceptable"
  - id: belt-core-lint-warns-on-belt-uri-unknown-sibling-pipeline
    category: lint
    severity: medium
    technique: equivalence-partition
    given: "a consumes: entry with uri: belt://latest/<pipeline>/... where no sibling <pipeline>.yml nor <pipeline>/pipeline.yml exists next to the current pipeline file"
    when: "lint_pipeline() is called"
    then: "a diagnostic mentioning the unknown pipeline name is emitted (advisory, non-fatal)"
  - id: belt-core-lint-warns-on-produces-without-gate
    category: lint
    severity: medium
    technique: equivalence-partition
    given: "a phase declaring produces: entries but whose gate does not protect those outputs"
    when: "lint_pipeline() is called"
    then: "a Warning-severity diagnostic mentioning 'not protected by gate' is emitted"
  - id: belt-core-lint-rejects-removed-invoke-keys
    category: lint
    severity: high
    technique: decision-table
    given: "a phase whose invoke: block uses one of the removed keys agent, agents, or iterations (post-2026-04-16 migration)"
    when: "lint_raw_pipeline_yaml() is called"
    then: "returns Err whose Display mentions the removed key name; invoke.agent additionally mentions 'no longer supported' or 'removed'"
  - id: belt-core-lint-pipeline-surfaces-migration-hint
    category: lint
    severity: high
    technique: equivalence-partition
    given: "a pipeline file on disk containing invoke.agent"
    when: "lint_pipeline() is called (the CLI entry point used by 'belt lint')"
    then: "the rendered result (Err Display or Ok diagnostics Debug) contains both 'invoke.agent' and 'no longer supported', ensuring the raw-YAML migration hint is surfaced rather than the generic serde untagged-enum error"

  # --- model module ---
  - id: belt-core-model-parses-minimal-pipeline
    category: model
    severity: high
    technique: equivalence-partition
    given: "a minimal pipeline YAML (name, version, one phase, single cmd gate)"
    when: "serde_saphyr deserialises it into Pipeline"
    then: "pipeline.name, version, and phases[0].id match the YAML; description is None, args is empty, and phases[0].gate[0] is the GateCheck::Cmd variant carrying the expected cmd string"
  - id: belt-core-model-parses-phase-with-all-fields-and-gate-variants
    category: model
    severity: high
    technique: equivalence-partition
    given: "a phase YAML exercising every field (when, confirm, max_retries, config map, produces list, validate, regate) plus all five gate shapes (cmd, file_exists, git_clean, has_output, uses with with-map)"
    when: "serde_saphyr deserialises the pipeline"
    then: "every scalar/optional field and each gate variant deserialises into its matching GateCheck discriminant with original values preserved"
  - id: belt-core-model-parses-gate-definition
    category: model
    severity: high
    technique: equivalence-partition
    given: "a standalone gate definition YAML with name, description, typed inputs (required string, number with default), and a checks list"
    when: "serde_saphyr deserialises it into GateDefinition"
    then: "name, description, inputs (including ArgType::String/Number, required flag, default value), and the checks list populate as declared"
  - id: belt-core-model-parses-sub-pipeline-with-typed-inputs
    category: model
    severity: high
    technique: equivalence-partition
    given: "a sub-pipeline YAML with name, version, typed inputs including ArgType::List and ArgType::Number with default, and multiple phases"
    when: "serde_saphyr deserialises it into SubPipeline"
    then: "all top-level fields plus inputs (with correct ArgType variants and defaults) and phases (ids in order) populate as declared"
  - id: belt-core-model-parses-pipeline-args-with-arg-types
    category: model
    severity: high
    technique: equivalence-partition
    given: "a pipeline YAML declaring args with ArgType::Bool (default false) and ArgType::Number (default 4)"
    when: "serde_saphyr deserialises the pipeline"
    then: "Pipeline.args contains both entries with correct ArgType discriminants and default values preserved as typed JSON values"
  - id: belt-core-model-cmd-timeout-default-and-explicit-and-zero
    category: model
    severity: high
    technique: boundary-value
    given: "a GateCheck::Cmd YAML with no timeout field, with an explicit positive timeout, or with timeout=0"
    when: "serde_saphyr deserialises the pipeline"
