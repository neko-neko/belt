  - id: belt-core-gate-file-exists-no-match-fails
    category: gate
    severity: high
    technique: equivalence-partition
    given: "a work directory that has no file satisfying the file_exists glob"
    when: "execute_gate is called with GateCheck::FileExists"
    then: "returns check_type = 'file_exists', passed = false, and detail mentions 'no files'"
  - id: belt-core-gate-has-output-non-empty-passes
    category: gate
    severity: high
    technique: equivalence-partition
