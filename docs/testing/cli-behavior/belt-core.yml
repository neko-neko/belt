  # --- gate module ---
  - id: belt-core-gate-cmd-zero-exit-passes
    category: gate
    severity: high
    technique: equivalence-partition
    given: "a GateCheck::Cmd whose shell invocation exits with status 0 within the configured timeout (including timeout: 0 = unlimited and short cmds well below the timeout budget)"
    when: "execute_gate is called"
    then: "returns GateResult with check_type = 'cmd', passed = true, timed_out = false, and duration_ms Some(<elapsed>) strictly below the timeout budget"
  - id: belt-core-gate-cmd-nonzero-or-spawn-or-signal-fails-without-timeout
    category: gate
    severity: high
    technique: error-guessing
    given: "a GateCheck::Cmd that (a) exits non-zero, (b) targets a nonexistent binary (sh -c returns 127), (c) writes to stderr then exits non-zero, or (d) is killed by a signal — all within the timeout budget"
    when: "execute_gate is called"
    then: "returns passed = false, timed_out = false, duration_ms set, and detail mentions the cause ('exit' code, 'not found', captured stderr text, or 'signal' depending on the failure mode)"
  - id: belt-core-gate-cmd-timeout-kills-and-reports
    category: gate
    severity: high
    technique: boundary-value
    given: "a GateCheck::Cmd running `sleep 60` with timeout: N seconds (N small and positive)"
    when: "execute_gate is called"
    then: "the child is killed at the deadline, passed = false, timed_out = true, detail contains 'timed out', and duration_ms is within [N*1000, (N+2)*1000)"
  - id: belt-core-gate-file-exists-glob-matches
    category: gate
    severity: high
    technique: equivalence-partition
    given: "a work directory containing a file that matches the file_exists glob pattern (e.g. *.txt vs hello.txt)"
