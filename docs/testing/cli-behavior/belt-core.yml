    when: "execute_gate is called"
    then: "returns check_type = 'has_output', passed = true, and detail mentions 'non-empty'"
  - id: belt-core-gate-has-output-empty-dir-fails
    category: gate
    severity: high
    technique: equivalence-partition
    given: "a GateCheck::HasOutput { has_output: true } and an empty output_dir"
    when: "execute_gate is called"
    then: "returns check_type = 'has_output', passed = false, and detail mentions 'empty'"
  - id: belt-core-gate-result-json-round-trip-and-timed-out-default
    category: gate
    severity: medium
    technique: equivalence-partition
    given: "a GateResult value, or a JSON payload missing the timed_out field, or a non-cmd gate execution"
    when: "GateResult is serialized/deserialized via serde_json and non-cmd execute_gate is observed"
    then: "timed_out serializes as the expected boolean, a round-trip preserves every field, JSON without timed_out deserializes with default false, and non-cmd gates always report timed_out = false"
  - id: belt-core-gate-execute-gates-and-all-passed-aggregate
    category: gate
    severity: high
    technique: decision-table
