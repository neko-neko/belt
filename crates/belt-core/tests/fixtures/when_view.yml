
name: test-when-view
version: 1
args:
  e2e:
    type: bool
    default: false
phases:
  - id: phase1
    description: "Phase 1"
    invoke:
      skill: /test-skill
    produces:
      - name: conditional
        path: "out/*.md"
        when: "args.e2e"
      - name: unconditional
        path: "other/*.md"
