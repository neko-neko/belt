[package]
name = "belt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "belt agent runtime CLI — workflow state machine execution for LLM agents (Phase 2 target, placeholder in Phase 1)"

[lints]
workspace = true

[[bin]]
name = "belt"
path = "src/main.rs"

[dependencies]
belt-core = { path = "../belt-core" }
clap.workspace = true
miette = { workspace = true, features = ["fancy-no-backtrace"] }
# belt は agent runtime 専用 binary (原則 8 — Separation by Audience)。
# ⚠ TUI/GUI 系依存 (ratatui, crossterm, tui-*, iced, egui) は一切追加禁止。
# ⚠ HTTP/gRPC (reqwest, hyper, tonic) は原則禁止、必要時は spec に justification。
# ⚠ async runtime (tokio, async-std, smol) は原則禁止、同期実行を基本。
# ⚠ lint / fmt 系ロジックは belt-dev binary crate にのみ配置。belt には入れない。
# 詳細は spec の "Dependency Management Policy" および原則 8 参照。

[dev-dependencies]
insta.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
