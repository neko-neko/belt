[package]
name = "belt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "belt lint — static validator for belt YAML pipelines"
readme.workspace = true
publish = false

[package.metadata.dist]
dist = true

# CHANGELOG placeholder 置換は belt クレートが representative として所有する
# (workspace 共有 CHANGELOG のため、belt-agent 側は宣言しない)。
[[package.metadata.release.pre-release-replacements]]
file = "../../CHANGELOG.md"
search = "Unreleased"
replace = "{{version}}"

[[package.metadata.release.pre-release-replacements]]
file = "../../CHANGELOG.md"
search = "ReleaseDate"
replace = "{{date}}"

# `...HEAD` の置換は `<!-- next-url -->` 注入 (new Unreleased URL を追加) よりも
# 前に実行する必要がある。そうしないと 2 個の ...HEAD が存在し exactly=1 が失敗する。
[[package.metadata.release.pre-release-replacements]]
file = "../../CHANGELOG.md"
search = "\\.\\.\\.HEAD"
replace = "...{{tag_name}}"
exactly = 1

[[package.metadata.release.pre-release-replacements]]
file = "../../CHANGELOG.md"
search = "<!-- next-header -->"
replace = "<!-- next-header -->\n\n## [Unreleased] - ReleaseDate"
exactly = 1

[[package.metadata.release.pre-release-replacements]]
file = "../../CHANGELOG.md"
search = "<!-- next-url -->"
replace = "<!-- next-url -->\n[Unreleased]: https://github.com/neko-neko/belt/compare/{{tag_name}}...HEAD"
exactly = 1

[[bin]]
name = "belt"
path = "src/main.rs"

[dependencies]
belt-core = { path = "../belt-core" }
clap = { workspace = true }
miette = { workspace = true, features = ["fancy-no-backtrace"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
