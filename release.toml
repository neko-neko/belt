# Workspace-wide cargo-release policy
# (workspace root の release.toml は section header なしで key を直接記述)

# 全 crate で version を揃える
shared-version = true

# Workspace release で commit を 1 本にまとめる (default だが明示)
consolidate-commits = true

# main からのみ release を許可
allow-branch = ["main"]

# Tag name: workspace 全体で "v{{version}}" を使う
tag-name = "v{{version}}"
tag-prefix = ""
tag-message = "chore: Release v{{version}}"

# Release commit
pre-release-commit-message = "chore: Release v{{version}}"

# crates.io publish は今回のスコープ外
publish = false

# verify (local cargo build) は default の true を保持
# → pre-release 時に build 破綻を catch できる

# CHANGELOG.md placeholder 置換は workspace root の単一 CHANGELOG を更新する
# ため、representative crate (belt) の `[package.metadata.release]` で宣言する。
# cargo-release FAQ "Maintaining Changelog" 参照:
# pre-release-replacements は package-configuration のため、workspace 共有
# CHANGELOG の場合は 1 crate に委任し、他 crate が重複実行しないようにする。
