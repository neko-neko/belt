name: review-cycle
description: "Reusable review pattern: dispatch agents, triage findings, fix approved items"
version: 1

inputs:
  skill: { type: string, required: true }
  perspectives: { type: list, required: true }

phases:
  - id: review
    description: |
      Run review skill with parallel agents for each perspective.
      Collect findings and synthesize into a unified report.
    config:
      skill: "${inputs.skill}"
      perspectives: "${inputs.perspectives}"
    artifacts: [".belt/review-results.json"]
    gate:
      - file_exists: ".belt/review-results.json"
    validate:
      - "All perspectives have been evaluated (no skipped perspectives)"

  - id: triage
    description: |
      Present findings to user. For each finding, decide:
      - fix: apply in this cycle
      - defer: tracked but not fixed now
      - reject: not applicable
      Impact severity high+ findings cannot be auto-deferred.
    confirm: true
    artifacts: [".belt/approved-findings.json"]
    gate:
      - file_exists: ".belt/approved-findings.json"
    validate:
      - "Every severity:high+ finding has explicit user decision (no auto-defer)"

  - id: fix
    description: |
      Fix all approved findings.
      After fixing, gate verifies no unresolved findings remain.
    gate:
      - uses: ../gates/findings-resolved.yml
      - git_clean: true
    validate:
      - "Each fix addresses the root cause, not just the symptom"
    max_retries: 3
