name: rust-build
description: "Rust workspace build, test, lint, format checks"

inputs:
  scope: { type: string, default: "--workspace" }

checks:
  - cmd: "cargo build ${scope}"
  - cmd: "cargo test ${scope}"
  - cmd: "cargo clippy ${scope} -- -D warnings"
  - cmd: "cargo fmt --check"
  - git_clean: true
